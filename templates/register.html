<!DOCTYPE html>
<html lang="en">
<head>
    <!-- ========================================== -->
    <!-- 1. DOCUMENT SETUP & DEPENDENCIES           -->
    <!-- ========================================== -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IK Attendance | Register</title>
    
    <!-- External Libraries: Google Fonts & Lucide Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Link to our external CSS file -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    
    <!-- ========================================== -->
    <!-- 2. NAVIGATION BAR                          -->
    <!-- ========================================== -->
    <nav>
        <div class="logo">IK</div>
        <div class="nav-links">
            <a href="/">Verify</a>
            <a href="/register_page" class="active">Register</a>
        </div>
    </nav>

    <!-- ========================================== -->
    <!-- 3. MAIN CONTENT (Enrollment Form)          -->
    <!-- ========================================== -->
    <main class="register-main">
        
        <!-- Left Side: Page Title -->
        <div class="hero-text">
            <h1>ENROLL</h1>
            <p class="subtitle">Secure Database Registration</p>
        </div>

        <!-- Right Side: The Input Form -->
        <div class="form-card">
            
            <!-- Text Inputs -->
            <div class="input-group">
                <label>Full Name</label>
                <input type="text" id="name" placeholder="e.g. John Doe" autocomplete="off" required>
            </div>
            
            <div class="input-group">
                <label>Student ID</label>
                <input type="text" id="student_id" placeholder="e.g. STU-001" autocomplete="off" required>
            </div>

            <!-- Image Upload Area -->
            <div class="input-group">
                <label>Reference Photo</label>
                <div class="upload-area" id="uploadArea">
                    <input type="file" id="imageUpload" accept="image/*">
                    
                    <div class="upload-placeholder" id="uploadPlaceholder">
                        <i data-lucide="upload-cloud" style="width: 32px; height: 32px;"></i>
                        <span>Click or drag image to upload</span>
                    </div>
                    
                    <!-- Hidden by default, shows the selected photo -->
                    <img id="imagePreview" alt="Preview">
                </div>
            </div>

            <!-- The Action Button -->
            <button id="registerBtn"><i data-lucide="user-plus"></i> Register Student</button>
            
            <!-- Hidden Alert Card (Shows Success/Error messages) -->
            <div id="statusCard" class="status-card">
                <i id="statusIcon"></i>
                <span id="statusText"></span>
            </div>
            
        </div>
    </main>

    <!-- ========================================== -->
    <!-- 4. FOOTER & SCRIPTS                        -->
    <!-- ========================================== -->
    <footer>
        &copy; 2026 Iqtadar. All Rights Reserved.
    </footer>
    
    <!-- Link to our external JavaScript file -->
    <script src="{{ url_for('static', filename='js/register.js') }}"></script>
    
</body>
</html>
